<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#27272a" stroke-width="4"/>
  
  <!-- Stylized Barbell / Pulse Wave Mark -->
  <g transform="translate(64, 64)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Barbell Plates Left -->
    <rect x="52" y="112" width="24" height="160" rx="8" fill="url(#lime)" filter="url(#glow)"/>
    <rect x="24" y="144" width="20" height="96" rx="6" fill="#a3e635" opacity="0.8"/>
    
    <!-- Central Bar -->
    <rect x="76" y="180" width="232" height="24" rx="6" fill="#e4e4e7"/>
    
    <!-- Pulse Line Through Bar -->
    <path d="M 100 192 L 150 192 L 175 130 L 205 254 L 235 160 L 255 210 L 284 192" 
          fill="none" stroke="#09090b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Barbell Plates Right -->
    <rect x="308" y="112" width="24" height="160" rx="8" fill="url(#lime)" filter="url(#glow)"/>
    <rect x="340" y="144" width="20" height="96" rx="6" fill="#a3e635" opacity="0.8"/>
  </g>
</svg>
